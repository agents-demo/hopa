<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" font-family="Segoe UI, Inter, Arial, sans-serif">
  <rect width="1600" height="1120" fill="#F7F4EC"/>
  <rect x="20" y="20" width="1560" height="1080" rx="28" fill="#FBF9F3" stroke="#E7E0D2"/>

  <text x="80" y="92" font-size="48" font-weight="700" fill="#1B2A4A">Where a HOPA turn can go</text>
  <text x="82" y="130" font-size="23" fill="#5B6B85">Two equal clients, one shared loop</text>

  <!-- Phone card -->
  <rect x="60" y="170" width="660" height="480" rx="26" fill="#EAF1FB" stroke="#5B7FD4" stroke-width="2"/>
  <text x="390" y="222" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="1" fill="#1B2A4A">YOUR PHONE</text>
  <text x="390" y="256" text-anchor="middle" font-size="18" fill="#5B6B85">One turn</text>

  <g>
    <rect x="110" y="286" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="138" y="321" font-size="20" fill="#22314F">TRC Anchor-Based Decision Model</text>
    <rect x="110" y="358" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="138" y="393" font-size="20" fill="#22314F">TRC Tree-Based Decision Model</text>
    <rect x="110" y="430" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="138" y="465" font-size="20" fill="#22314F">Small Language Model</text>
    <rect x="110" y="502" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="138" y="537" font-size="20" fill="#22314F">API Language Model</text>
  </g>
  <text x="390" y="618" text-anchor="middle" font-size="18" fill="#5B6B85">Screen access</text>

  <!-- Computer card -->
  <rect x="880" y="170" width="660" height="480" rx="26" fill="#EAF1FB" stroke="#5B7FD4" stroke-width="2"/>
  <text x="1210" y="222" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="1" fill="#1B2A4A">YOUR COMPUTER</text>
  <text x="1210" y="256" text-anchor="middle" font-size="18" fill="#5B6B85">One turn</text>

  <g>
    <rect x="930" y="286" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="958" y="321" font-size="20" fill="#22314F">TRC Anchor-Based Decision Model</text>
    <rect x="930" y="358" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#8A97AB" stroke-dasharray="7 5"/>
    <text x="958" y="393" font-size="20" fill="#22314F">TRC Tree-Based Decision Model</text>
    <rect x="1370" y="370" width="98" height="30" rx="12" fill="#F1F3F7" stroke="#D5DBE5"/>
    <text x="1419" y="390" text-anchor="middle" font-size="13" fill="#6B7890">in work</text>
    <rect x="930" y="430" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="958" y="465" font-size="20" fill="#22314F">Small Language Model</text>
    <rect x="930" y="502" width="560" height="54" rx="18" fill="#FFFFFF" stroke="#B9CCEA"/>
    <text x="958" y="537" font-size="20" fill="#22314F">API Language Model</text>
  </g>
  <text x="1210" y="618" text-anchor="middle" font-size="18" fill="#5B6B85">UIA · approval</text>

  <!-- My computer link -->
  <rect x="724" y="536" width="152" height="60" rx="14" fill="#FFFFFF" stroke="#C9D2E0"/>
  <text x="800" y="558" text-anchor="middle" font-size="13" font-weight="600" fill="#22314F">My computer link</text>
  <text x="800" y="575" text-anchor="middle" font-size="10" fill="#6B7890">PC drives phone,</text>
  <text x="800" y="589" text-anchor="middle" font-size="10" fill="#6B7890">only when paired</text>
  <line x1="878" y1="612" x2="730" y2="612" stroke="#8A97AB" stroke-width="2" stroke-dasharray="8 6"/>
  <polygon points="730,612 744,605 744,619" fill="#8A97AB"/>

  <!-- Solid links to cloud -->
  <line x1="390" y1="650" x2="640" y2="790" stroke="#7A8699" stroke-width="2.5"/>
  <polygon points="640,790 626,781 634,773" fill="#7A8699"/>
  <line x1="1210" y1="650" x2="960" y2="790" stroke="#7A8699" stroke-width="2.5"/>
  <polygon points="960,790 966,773 974,781" fill="#7A8699"/>

  <!-- Cloud -->
  <rect x="520" y="790" width="560" height="140" rx="26" fill="#DDEFE3" stroke="#3F8F5A" stroke-width="2"/>
  <text x="800" y="845" text-anchor="middle" font-size="28" font-weight="700" letter-spacing="1" fill="#16301F">HOPA CLOUD</text>
  <text x="800" y="882" text-anchor="middle" font-size="18" fill="#2F5B42">account · tasks · wake-ups</text>

  <!-- Legend -->
  <line x1="520" y1="1008" x2="560" y2="1008" stroke="#7A8699" stroke-width="2.5"/>
  <text x="572" y="1014" font-size="15" fill="#5B6B85">available today</text>
  <line x1="760" y1="1008" x2="800" y2="1008" stroke="#A6B1C2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="812" y="1014" font-size="15" fill="#5B6B85">in work now</text>
</svg>
