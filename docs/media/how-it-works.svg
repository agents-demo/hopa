<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" role="img" aria-label="How HOPA works: you ask, HOPA looks and acts, you see the result">
  <defs>
    <linearGradient id="hiw-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A59F7"/>
      <stop offset="1" stop-color="#12B8A6"/>
    </linearGradient>
    <marker id="hiw-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#9FB3D1"/>
    </marker>
  </defs>

  <rect width="1600" height="440" fill="#FFFFFF"/>

  <!-- panel 1 -->
  <rect x="50" y="40" width="450" height="360" rx="30" fill="#F7F9FF" stroke="#E3EAF7" stroke-width="2"/>
  <circle cx="100" cy="96" r="20" fill="url(#hiw-brand)"/>
  <text x="100" y="102" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">1</text>
  <text x="138" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1B3A">You ask</text>
  <rect x="90" y="150" width="370" height="96" rx="22" fill="#0A59F7"/>
  <text x="116" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFFFFF">Summarize the top</text>
  <text x="116" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFFFFF">videos on Bilibili.</text>
  <text x="90" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6B85">In your own words.</text>
  <text x="90" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6B85">No commands to learn.</text>

  <!-- arrow -->
  <path d="M520 220h42" stroke="#9FB3D1" stroke-width="3" marker-end="url(#hiw-arrow)"/>

  <!-- panel 2 -->
  <rect x="575" y="40" width="450" height="360" rx="30" fill="#F7F9FF" stroke="#E3EAF7" stroke-width="2"/>
  <circle cx="625" cy="96" r="20" fill="url(#hiw-brand)"/>
  <text x="625" y="102" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">2</text>
  <text x="663" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1B3A">HOPA looks and acts</text>

  <rect x="680" y="140" width="230" height="170" rx="26" fill="#FFFFFF" stroke="#D8E2F3" stroke-width="2"/>
  <text x="700" y="166" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#0A2A66">Bilibili</text>

  <rect x="698" y="178" width="194" height="32" rx="8" fill="#E8EEFF"/>
  <rect x="704" y="184" width="24" height="20" rx="4" fill="#FB7299"/>
  <rect x="736" y="186" width="120" height="6" rx="3" fill="#AFC4E8"/>
  <rect x="736" y="198" width="80" height="6" rx="3" fill="#C9D7EE"/>
  <circle cx="872" cy="194" r="13" fill="none" stroke="#12B8A6" stroke-width="3"/>
  <circle cx="872" cy="194" r="4" fill="#12B8A6"/>

  <rect x="698" y="220" width="194" height="32" rx="8" fill="#F4F6FB"/>
  <rect x="704" y="226" width="24" height="20" rx="4" fill="#A9B9D4"/>
  <rect x="736" y="228" width="110" height="6" rx="3" fill="#C9D7EE"/>
  <rect x="736" y="240" width="72" height="6" rx="3" fill="#DCE5F2"/>

  <rect x="698" y="262" width="194" height="32" rx="8" fill="#F4F6FB"/>
  <rect x="704" y="268" width="24" height="20" rx="4" fill="#A9B9D4"/>
  <rect x="736" y="270" width="100" height="6" rx="3" fill="#C9D7EE"/>
  <rect x="736" y="282" width="64" height="6" rx="3" fill="#DCE5F2"/>

  <text x="705" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6B85">One small step at a time,</text>
  <text x="705" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6B85">checking the result.</text>

  <!-- arrow -->
  <path d="M1045 220h42" stroke="#9FB3D1" stroke-width="3" marker-end="url(#hiw-arrow)"/>

  <!-- panel 3 -->
  <rect x="1100" y="40" width="450" height="360" rx="30" fill="#F7F9FF" stroke="#E3EAF7" stroke-width="2"/>
  <circle cx="1150" cy="96" r="20" fill="url(#hiw-brand)"/>
  <text x="1150" y="102" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">3</text>
  <text x="1188" y="104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#0A1B3A">It's done</text>
  <circle cx="1210" cy="205" r="38" fill="#12B8A6"/>
  <path d="M1192 205l13 13 23-26" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1270" y="198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#0A1B3A">Top 3, summarized.</text>
  <text x="1270" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#5B6B85">You see the result.</text>
  <rect x="1160" y="290" width="330" height="58" rx="16" fill="#FFFFFF" stroke="#F0C9C9" stroke-width="2"/>
  <path d="M1188 308l10 18h-20z" fill="#B42318"/>
  <text x="1215" y="313" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#0A1B3A">Posting or paying? It asks.</text>
  <text x="1215" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#7A5A5A">Nothing public or paid without you.</text>
</svg>
