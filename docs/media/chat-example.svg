<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1950" role="img" aria-label="Illustration of a WeChat message task with the approval dialog">
  <rect width="900" height="1950" fill="#FFFFFF"/>

  <!-- status bar -->
  <text x="40" y="62" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#5B6B85">9:41</text>
  <text x="840" y="62" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5B6B85">100%</text>

  <!-- app bar -->
  <rect x="38" y="112" width="34" height="4" rx="2" fill="#0A1B3A"/>
  <rect x="38" y="124" width="34" height="4" rx="2" fill="#0A1B3A"/>
  <rect x="38" y="136" width="34" height="4" rx="2" fill="#0A1B3A"/>
  <text x="100" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#0A1B3A">Chat</text>

  <!-- user turn -->
  <rect x="260" y="230" width="600" height="132" rx="30" fill="#0A59F7"/>
  <text x="292" y="286" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#FFFFFF">Send Alice: running 10</text>
  <text x="292" y="326" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#FFFFFF">minutes late.</text>

  <!-- assistant turn -->
  <rect x="40" y="400" width="650" height="122" rx="30" fill="#F2F3F5"/>
  <text x="72" y="454" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#0A1B3A">I found Alice on WeChat.</text>
  <text x="72" y="494" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#0A1B3A">Ready to send:</text>

  <!-- composer behind the dialog -->
  <rect x="40" y="1640" width="650" height="84" rx="42" fill="#F2F3F5"/>
  <text x="76" y="1692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#8A9BB5">Ask HOPA...</text>
  <rect x="710" y="1640" width="150" height="84" rx="42" fill="#0A59F7"/>
  <text x="785" y="1692" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF">Send</text>

  <!-- dimmed app behind the dialog -->
  <rect width="900" height="1950" fill="#000000" opacity="0.35"/>

  <!-- approval dialog -->
  <rect x="80" y="620" width="740" height="590" rx="36" fill="#FFFFFF"/>
  <text x="120" y="704" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#0A1B3A">Send this message?</text>
  <text x="120" y="748" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#5B6B85">To Alice · WeChat</text>

  <rect x="120" y="786" width="660" height="150" rx="18" fill="#F7F9FF"/>
  <text x="146" y="840" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" fill="#0A1B3A">Running about 10 minutes late —</text>
  <text x="146" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" fill="#0A1B3A">start without me.</text>

  <text x="120" y="984" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#8A9BB5">Nothing is sent until you choose.</text>

  <rect x="120" y="1026" width="320" height="82" rx="41" fill="#EEF1F7"/>
  <text x="262" y="1078" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#333333">Deny</text>
  <rect x="460" y="1026" width="320" height="82" rx="41" fill="#B42318"/>
  <text x="620" y="1078" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF">Allow</text>

  <!-- honesty label -->
  <rect x="680" y="104" width="186" height="46" rx="23" fill="#FFFFFF" opacity="0.96"/>
  <text x="773" y="134" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#5B6B85">Illustration</text>
</svg>
