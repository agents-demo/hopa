<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="HOPA — reads the screen, taps, types, and asks before money moves">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFAF5"/>
      <stop offset="0.55" stop-color="#F7F2E9"/>
      <stop offset="1" stop-color="#F0E8DB"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="0.22" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F4D4C2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F4D4C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CFE0FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#CFE0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5EFE5"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#B8A58E" opacity="0.22"/>
    </pattern>
    <filter id="phoneShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#6E4E36" flood-opacity="0.28"/>
    </filter>
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#B65A32" flood-opacity="0.22"/>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6E4E36" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#paper)"/>
  <ellipse cx="330" cy="230" rx="470" ry="330" fill="url(#warmGlow)"/>
  <ellipse cx="1240" cy="260" rx="390" ry="330" fill="url(#blueGlow)"/>
  <rect width="1600" height="520" fill="url(#dots)"/>

  <!-- Small mascot, left; top aligned with the HOPA wordmark -->
  <g transform="translate(100 96) scale(0.34)" filter="url(#markShadow)">
    <path d="M 350 226 L 412 164" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" fill="none"/>
    <rect x="180" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="266" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="140" y="88" width="230" height="336" rx="72" fill="url(#coral)"/>
    <rect x="173" y="130" width="164" height="232" rx="42" fill="#FFF9F0"/>
    <rect x="212" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
    <rect x="280" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
    <path d="M 236 292 Q 261 312 286 292" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Words -->
  <text x="278" y="200" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="104" font-weight="800" letter-spacing="-3" fill="#1C1B18">HOPA</text>
  <text x="282" y="252" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="30" font-weight="500" fill="#2B2722">Say it. HOPA does it.</text>
  <text x="282" y="292" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="20" fill="#4A443A">The phone assistant for HarmonyOS.</text>
  <rect x="282" y="312" width="86" height="6" rx="3" fill="#E8703A" opacity="0.9"/>
  <text x="282" y="374" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="23" font-weight="500" fill="#1C1B18">Reads the screen. Taps. Types. Asks before money moves.</text>

  <!-- The app working, right; tilted for depth -->
  <g transform="translate(986 24) rotate(3 171 226)" filter="url(#phoneShadow)">
    <rect width="342" height="452" rx="48" fill="url(#frame)" stroke="#E1D8C9" stroke-width="2"/>
    <rect x="16" y="26" width="310" height="400" rx="34" fill="#F7F4EE"/>
    <rect x="134" y="14" width="74" height="9" rx="4.5" fill="#CFC5B6"/>

    <text x="36" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1B18">9:41</text>
    <circle cx="270" cy="53" r="4" fill="#B9B0A2"/>
    <circle cx="256" cy="53" r="4" fill="#B9B0A2"/>
    <circle cx="242" cy="53" r="4" fill="#B9B0A2"/>

    <!-- user prompt -->
    <rect x="104" y="86" width="196" height="64" rx="20" fill="#0A59F7"/>
    <text x="122" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Order the cheapest</text>
    <text x="122" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">charger in my cart.</text>
    <text x="196" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#0A59F7">Copy   Retry</text>

    <!-- tiny mascot beside the answer -->
    <g transform="translate(36 190) scale(0.09)">
      <path d="M 350 226 L 412 164" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" fill="none"/>
      <rect x="180" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
      <rect x="266" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
      <rect x="140" y="88" width="230" height="336" rx="72" fill="url(#coral)"/>
      <rect x="173" y="130" width="164" height="232" rx="42" fill="#FFF9F0"/>
      <rect x="212" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
      <rect x="280" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
      <path d="M 236 292 Q 261 312 286 292" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>

    <!-- answer -->
    <text x="86" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1C1B18">The Anker 20W is ¥129.</text>
    <text x="86" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1C1B18">I need your OK before</text>
    <text x="86" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1C1B18">paying.</text>
    <text x="38" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#0A59F7">Copy</text>

    <!-- payment approval card -->
    <rect x="26" y="284" width="290" height="124" rx="20" fill="#FFFFFF" stroke="#E4DED2" stroke-width="1.5"/>
    <rect x="244" y="296" width="60" height="16" rx="8" fill="#E8703A" opacity="0.14"/>
    <text x="254" y="307" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#E8703A">PAYMENT</text>
    <text x="42" y="316" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1B18">Confirm payment?</text>
    <text x="42" y="336" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5E574C">¥129  ·  Anker 20W charger</text>
    <rect x="42" y="350" width="92" height="32" rx="16" fill="#F1ECE2"/>
    <text x="88" y="371" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1C1B18">Deny</text>
    <rect x="146" y="350" width="92" height="32" rx="16" fill="#0A59F7"/>
    <text x="192" y="371" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Allow</text>
    <text x="42" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#8B8375">Nothing is paid until you Allow.</text>
  </g>

  <!-- Floating payment-paused chip -->
  <g transform="translate(1360 286)" filter="url(#chipShadow)">
    <rect width="208" height="50" rx="25" fill="#FFFFFF" stroke="#E2D9CA" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="13" fill="#0A59F7"/>
    <rect x="20" y="19" width="3.5" height="12" rx="1.75" fill="#FFFFFF"/>
    <rect x="27" y="19" width="3.5" height="12" rx="1.75" fill="#FFFFFF"/>
    <text x="48" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1C1B18">Waiting for your OK</text>
  </g>
</svg>
