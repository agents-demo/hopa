<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="HOPA — the phone assistant for HarmonyOS">
  <defs>
    <linearGradient id="hopa-banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A3A"/>
      <stop offset="0.55" stop-color="#0A2E6B"/>
      <stop offset="1" stop-color="#0A59F7"/>
    </linearGradient>
    <linearGradient id="hopa-banner-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A59F7"/>
      <stop offset="1" stop-color="#12B8A6"/>
    </linearGradient>
    <linearGradient id="hopa-banner-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FF"/>
    </linearGradient>
    <pattern id="hopa-banner-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#hopa-banner-bg)"/>
  <rect width="1600" height="520" fill="url(#hopa-banner-dots)"/>
  <circle cx="1480" cy="80" r="260" fill="#12B8A6" opacity="0.10"/>
  <circle cx="1180" cy="480" r="220" fill="#0A59F7" opacity="0.20"/>

  <g transform="translate(106 108)">
    <rect width="132" height="132" rx="34" fill="url(#hopa-banner-mark)"/>
    <rect x="38" y="24" width="56" height="84" rx="14" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.45"/>
    <path d="M50 47v34M82 47v34M50 64h32" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="91" r="4" fill="#FFFFFF" opacity="0.85"/>
    <path d="M104 18l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <text x="272" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="104" font-weight="800" fill="#FFFFFF" letter-spacing="2">HOPA</text>
  <text x="276" y="252" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#C9DCFF">Say it. HOPA does it.</text>
  <text x="276" y="298" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="23" fill="#8FB4E8">The phone assistant for HarmonyOS.</text>
  <text x="276" y="366" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#DCE8FF">Reads the screen. Taps. Types. Asks before money moves.</text>

  <g transform="translate(1160 56)">
    <rect width="310" height="408" rx="46" fill="#0B1B36" stroke="#2C4C7C" stroke-width="3"/>
    <rect x="16" y="28" width="278" height="352" rx="30" fill="url(#hopa-banner-screen)"/>
    <rect x="118" y="8" width="74" height="10" rx="5" fill="#2C4C7C"/>

    <text x="38" y="58" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#8A9BB5">9:41</text>
    <circle cx="258" cy="52" r="4" fill="#C3CEDF"/>
    <circle cx="244" cy="52" r="4" fill="#C3CEDF"/>
    <circle cx="230" cy="52" r="4" fill="#C3CEDF"/>

    <rect x="36" y="86" width="214" height="74" rx="18" fill="#0A59F7"/>
    <text x="54" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">What's hot on</text>
    <text x="54" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Bilibili today?</text>

    <rect x="52" y="178" width="214" height="64" rx="18" fill="#E8EEFF"/>
    <text x="70" y="204" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#0A2A66">Top 3 videos,</text>
    <text x="70" y="226" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#0A2A66">with links.</text>

    <circle cx="216" cy="268" r="22" fill="#12B8A6"/>
    <path d="M206 268l7 7 13-14" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="36" y="300" width="214" height="44" rx="22" fill="#FFFFFF" stroke="#D8E2F3" stroke-width="2"/>
    <text x="56" y="327" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#8A9BB5">Ask HOPA anything…</text>
    <circle cx="230" cy="322" r="13" fill="#0A59F7"/>
    <path d="M224 322h12M231 317l5 5-5 5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
