<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="HOPA — your phone agent">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="0.6" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#B65A32" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#paper)"/>
  <circle cx="1410" cy="60" r="220" fill="#E8703A" opacity="0.05"/>
  <circle cx="90" cy="500" r="260" fill="#0A59F7" opacity="0.04"/>
  <circle cx="1210" cy="470" r="140" fill="#E8703A" opacity="0.06"/>

  <g transform="translate(112 52) scale(0.78)" filter="url(#soft)">
    <path d="M 356 238 L 418 176" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" fill="none"/>
    <rect x="190" y="446" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="276" y="446" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="150" y="112" width="230" height="336" rx="72" fill="url(#coral)"/>
    <rect x="183" y="154" width="164" height="232" rx="42" fill="#FFF9F0"/>
    <rect x="222" y="228" width="26" height="58" rx="13" fill="#1C1B18"/>
    <rect x="290" y="228" width="26" height="58" rx="13" fill="#1C1B18"/>
    <path d="M 246 316 Q 271 336 296 316" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>

  <text x="552" y="218" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="132" font-weight="800" letter-spacing="-4" fill="#1C1B18">HOPA</text>
  <text x="558" y="286" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="42" font-weight="500" fill="#4A463E">Say it. HOPA does it.</text>
  <text x="560" y="340" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="24" fill="#8B8375">The hands-off phone assistant</text>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">
    <rect x="558" y="378" width="112" height="48" rx="24" fill="#0A59F7"/>
    <text x="614" y="410" text-anchor="middle" fill="#FFFFFF">Chat</text>
    <rect x="684" y="378" width="142" height="48" rx="24" fill="#FFFFFF" stroke="#E4DED2"/>
    <text x="755" y="410" text-anchor="middle" fill="#1C1B18">Activity</text>
    <rect x="840" y="378" width="186" height="48" rx="24" fill="#FFFFFF" stroke="#E4DED2"/>
    <text x="933" y="410" text-anchor="middle" fill="#1C1B18">Capabilities</text>
  </g>
</svg>
