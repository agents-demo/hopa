<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="HOPA — reads the screen, taps, types, and asks before money moves">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="0.6" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#F1ECE2"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#8A6A4E" flood-opacity="0.18"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#B65A32" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#paper)"/>
  <circle cx="1460" cy="40" r="220" fill="#E8703A" opacity="0.05"/>
  <circle cx="60" cy="510" r="250" fill="#0A59F7" opacity="0.04"/>
  <circle cx="1010" cy="500" r="120" fill="#E8703A" opacity="0.05"/>

  <!-- Small mascot, left; top aligned with the HOPA wordmark -->
  <g transform="translate(88 96) scale(0.34)" filter="url(#markShadow)">
    <path d="M 350 226 L 412 164" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" fill="none"/>
    <rect x="180" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="266" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
    <rect x="140" y="88" width="230" height="336" rx="72" fill="url(#coral)"/>
    <rect x="173" y="130" width="164" height="232" rx="42" fill="#FFF9F0"/>
    <rect x="212" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
    <rect x="280" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
    <path d="M 236 292 Q 261 312 286 292" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Words -->
  <text x="308" y="200" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="104" font-weight="800" letter-spacing="-3" fill="#1C1B18">HOPA</text>
  <text x="312" y="252" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="28" font-weight="500" fill="#6F675B">Say it. HOPA does it.</text>
  <text x="312" y="290" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="21" fill="#8B8375">The phone assistant for HarmonyOS.</text>
  <text x="312" y="362" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="22" fill="#1C1B18">Reads the screen. Taps. Types. Asks before money moves.</text>

  <!-- The app working, right -->
  <g transform="translate(1136 34)" filter="url(#phoneShadow)">
    <rect width="342" height="452" rx="48" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
    <rect x="16" y="26" width="310" height="400" rx="34" fill="#F7F4EE"/>

    <text x="36" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1C1B18">9:41</text>
    <circle cx="270" cy="53" r="4" fill="#B9B0A2"/>
    <circle cx="256" cy="53" r="4" fill="#B9B0A2"/>
    <circle cx="242" cy="53" r="4" fill="#B9B0A2"/>

    <!-- user prompt -->
    <rect x="112" y="86" width="188" height="64" rx="20" fill="#0A59F7"/>
    <text x="130" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Open Settings and</text>
    <text x="130" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">show me Wi-Fi</text>
    <text x="212" y="170" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#0A59F7">Copy   Retry</text>

    <!-- tiny mascot beside the answer -->
    <g transform="translate(36 190) scale(0.09)">
      <path d="M 350 226 L 412 164" stroke="url(#coral)" stroke-width="32" stroke-linecap="round" fill="none"/>
      <rect x="180" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
      <rect x="266" y="422" width="44" height="44" rx="14" fill="url(#coral)"/>
      <rect x="140" y="88" width="230" height="336" rx="72" fill="url(#coral)"/>
      <rect x="173" y="130" width="164" height="232" rx="42" fill="#FFF9F0"/>
      <rect x="212" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
      <rect x="280" y="204" width="26" height="58" rx="13" fill="#1C1B18"/>
      <path d="M 236 292 Q 261 312 286 292" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>

    <!-- answer -->
    <text x="86" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1C1B18">WLAN is on.</text>
    <text x="86" y="220" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1C1B18">You’re connected to</text>
    <text x="86" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1C1B18">Huawei-Guest.</text>
    <text x="38" y="272" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#0A59F7">Copy</text>

    <!-- composer -->
    <rect x="26" y="338" width="290" height="52" rx="26" fill="#FFFFFF" stroke="#E4DED2" stroke-width="1.5"/>
    <text x="48" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#A39A8B">Ask HOPA…</text>
    <circle cx="292" cy="364" r="18" fill="#0A59F7"/>
    <path d="M286 364h13M294 358l6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
