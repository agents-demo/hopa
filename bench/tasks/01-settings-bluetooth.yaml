schema_version: 1
id: settings-bluetooth
goal: "Open Settings and reach the Bluetooth screen"
app: Settings
bundle: com.huawei.hmos.settings
success:
  type: text_visible
  any: ["Bluetooth", "Bluetooth settings"]
steps:
  - action: launch
  - action: wait
    seconds: 2
  - action: tap_text
    text: "Bluetooth"
  - action: wait
    seconds: 1
max_steps: 10
