[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopa-bridge"
version = "0.1.0"
description = "Control a HarmonyOS device over hdc + uitest (CLI and MCP server)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The HOPA Authors" }]
keywords = ["harmonyos", "hdc", "uitest", "gui-agent", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
hopa-bridge = "hopa_bridge.cli:main"
# One-release alias: the command name users and scripts already know.
pc-agent = "hopa_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hopa_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
