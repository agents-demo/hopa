schema_version: 1
id: clock-open-alarm
goal: "Open Clock and switch to the Alarm tab"
app: Clock
bundle: com.huawei.hmos.clock
success:
  type: text_visible
  any: ["Alarm", "Alarms"]
steps:
  - action: launch
  - action: wait
    seconds: 2
  - action: tap_text
    text: "Alarm"
  - action: wait
    seconds: 1
max_steps: 10
