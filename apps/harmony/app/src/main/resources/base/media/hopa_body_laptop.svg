<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HOPA as a laptop">
  <defs>
    <linearGradient id="mascot-coral-laptop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
  </defs>

  <!-- feet, tucked under the deck -->
  <rect x="150" y="384" width="32" height="28" rx="10" fill="url(#mascot-coral-laptop)"/>
  <rect x="334" y="384" width="32" height="28" rx="10" fill="url(#mascot-coral-laptop)"/>

  <!-- deck -->
  <rect x="48" y="348" width="420" height="36" rx="15" fill="url(#mascot-coral-laptop)"/>
  <rect x="128" y="361" width="258" height="6" rx="3" fill="#FFF9F0" opacity="0.85"/>

  <!-- lid: landscape, the way a real laptop reads -->
  <rect x="66" y="92" width="384" height="256" rx="24" fill="url(#mascot-coral-laptop)"/>
  <rect x="101" y="109" width="314" height="222" rx="11" fill="#FFF9F0"/>

  <!-- eyes: paired with the eyelid overlay in HopaMark -->
  <rect x="208" y="168" width="30" height="64" rx="15" fill="#1C1B18"/>
  <rect x="276" y="168" width="30" height="64" rx="15" fill="#1C1B18"/>

  <!-- smile -->
  <path d="M 232 258 Q 257 278 282 258" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
</svg>
