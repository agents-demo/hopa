<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HOPA as a laptop">
  <defs>
    <linearGradient id="mascot-coral-laptop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
  </defs>

  <!-- deck -->
  <rect x="56" y="338" width="400" height="42" rx="20" fill="url(#mascot-coral-laptop)"/>
  <rect x="100" y="347" width="312" height="3" rx="1.5" fill="#FFF9F0" opacity="0.50"/>
  <rect x="214" y="356" width="84" height="15" rx="6" fill="#FFF9F0" opacity="0.85"/>

  <!-- lid: the same thickness of body as the phone -->
  <rect x="72" y="92" width="368" height="246" rx="34" fill="url(#mascot-coral-laptop)"/>
  <circle cx="256" cy="110" r="3.6" fill="#FFF9F0" opacity="0.5"/>
  <rect x="126" y="128" width="260" height="168" rx="26" fill="#FFF9F0"/>

  <!-- eyes -->
  <rect x="206" y="156" width="30" height="62" rx="15" fill="#1C1B18"/>
  <rect x="276" y="156" width="30" height="62" rx="15" fill="#1C1B18"/>

  <!-- smile -->
  <path d="M 230 240 Q 256 256 282 240" stroke="#1C1B18" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
