<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HOPA as a laptop">
  <defs>
    <linearGradient id="mascot-coral-laptop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F08A5B"/>
      <stop offset="1" stop-color="#E8703A"/>
    </linearGradient>
  </defs>

  <!-- deck -->
  <rect x="58" y="338" width="396" height="40" rx="14" fill="url(#mascot-coral-laptop)"/>
  <rect x="100" y="346" width="312" height="3" rx="1.5" fill="#FFF9F0" opacity="0.50"/>
  <rect x="216" y="354" width="80" height="14" rx="4" fill="#FFF9F0" opacity="0.85"/>

  <!-- lid -->
  <rect x="74" y="96" width="364" height="242" rx="22" fill="url(#mascot-coral-laptop)"/>
  <circle cx="256" cy="104" r="3.5" fill="#FFF9F0" opacity="0.55"/>
  <rect x="88" y="112" width="336" height="200" rx="9" fill="#FFF9F0"/>

  <!-- eyes -->
  <rect x="202" y="160" width="32" height="64" rx="16" fill="#1C1B18"/>
  <rect x="278" y="160" width="32" height="64" rx="16" fill="#1C1B18"/>

  <!-- smile -->
  <path d="M 228 252 Q 256 272 284 252" stroke="#1C1B18" stroke-width="13" stroke-linecap="round" fill="none"/>
</svg>
