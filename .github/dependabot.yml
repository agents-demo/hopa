version: 2
updates:
  - package-ecosystem: pip
    directory: "/evals/baseline"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/evals/bench"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/services/pc-agent"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # The default limit of 5 used up every slot on one batch, so older
    # actions (for example actions/cache) silently got no PR.
    open-pull-requests-limit: 10
