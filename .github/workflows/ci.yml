name: CI

# Honest constraints of this workflow:
#
# 1. The official HarmonyOS Command Line Tools are behind a Huawei developer
#    login, so they cannot be downloaded anonymously. Mirror the official
#    commandline-tools-*-26.0.0.851.zip somewhere your CI can read and set the
#    repository secrets HARMONY_CLI_TOOLS_URL (and optionally
#    HARMONY_CLI_TOOLS_SHA256). Without them the HAP job skips with a warning
#    instead of pretending to build.
# 2. `hvigorw test` (Local Test) is NOT supported on Linux. The core unit tests
#    therefore run on a macOS runner; the HAP build runs on Linux as requested.
# 3. hopa-bridge and bench are pure Python and run on Linux with no toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Android and Windows are the two expensive jobs. They are gated by the paths
  # they actually build: core/build-logic changes both, while a WPF-only change
  # skips Android and an Android-only change skips Windows.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'core/**'
              - 'build-logic/**'
              - 'tools/checks/check-android-structure.py'
              - '.github/workflows/ci.yml'
            windows:
              - 'apps/windows/**'
              - 'core/**'
              - 'build-logic/**'
              - 'apps/android/gradle/libs.versions.toml'
              - 'apps/android/gradle/wrapper/**'
              - 'apps/android/gradlew'
              - 'apps/android/gradlew.bat'
              - 'tools/scripts/windows-package.ps1'
              - '.github/workflows/ci.yml'

  python:
    name: bridge + evals (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -U pip
          python -m pip install -e "./services/wire" -e "./services/bridge" -e "./services/relay" -e "./services/evals/bench[dev]" -e "./services/evals/baseline[dev]" "ruff>=0.6" "pytest>=8" "jsonschema>=4" "Pillow>=10" "numpy>=1.26"
      - name: Ruff
        run: ruff check services/wire services/bridge services/relay services/evals/bench services/evals/baseline
      - name: Ruff format
        run: ruff format --check services/wire services/bridge services/relay services/evals/bench services/evals/baseline
      - name: pytest (wire)
        run: pytest services/wire
      - name: pytest (bridge)
        run: pytest services/bridge
      - name: pytest (relay)
        run: pytest services/relay
      - name: pytest (bench)
        run: pytest services/evals/bench
      - name: pytest (baseline)
        run: pytest services/evals/baseline --cov=hopa_baseline --cov-report=term --cov-fail-under=80
      - name: pytest (plan tooling)
        run: pytest tools/scripts
      - name: Plan lint
        run: python tools/scripts/plan-status.py --lint
      - name: Structure rules
        run: python tools/checks/check-structure.py --strict
      - name: Bridge contract
        run: python services/tools/checks/check-openapi.py
      - name: Conformance fixtures
        run: python tools/checks/check-conformance.py
      - name: Gateway fixtures
        run: python tools/checks/check-gateway-fixtures.py
      - name: Wire types match the schemas
        run: python tools/checks/check-wire-types.py
      - name: Routing fixtures
        run: python tools/checks/check-routing.py
      - name: Android structure
        run: python tools/checks/check-android-structure.py
      - name: Helper start command is in sync
        run: python tools/checks/check-helper-command.py
      - name: Every setting is stored
        run: python tools/checks/check-settings-fields.py
      - name: Observation hash vector
        run: python tools/checks/check-observation-hash.py
      - name: Tree rules
        run: python tools/checks/check-tree.py
      - name: Render blueprint
        run: python services/tools/checks/check-render.py
      - name: Documentation links
        run: python tools/checks/check-links.py
      - name: Generated app catalogue is current
        run: python tools/scripts/build-app-catalog.py --check
      - name: Generated knowledge bundle is current
        run: python tools/scripts/build-knowledge-bundle.py --check
      - name: Generated policy data is current
        run: python tools/scripts/build-policy-data.py --check
      - name: Generated prompt rules are current
        run: python tools/scripts/build-prompt-rules.py --check
      - name: Validate benchmark tasks
        run: python -m hopa_bench validate --tasks services/evals/bench/tasks

  build-hap:
    name: Build HAP (Linux)
    runs-on: ubuntu-latest
    env:
      CLT_URL: ${{ secrets.HARMONY_CLI_TOOLS_URL }}
      CLT_SHA256: ${{ secrets.HARMONY_CLI_TOOLS_SHA256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain availability
        run: |
          if [ -z "$CLT_URL" ]; then
            echo "::warning title=HarmonyOS toolchain not configured::The official Command Line Tools require a Huawei developer login. Mirror commandline-tools-*-26.0.0.851.zip and set HARMONY_CLI_TOOLS_URL (and HARMONY_CLI_TOOLS_SHA256). Skipping the HAP build."
          else
            echo "Using a mirrored Command Line Tools archive."
          fi

      - name: Restore toolchain cache
        if: env.CLT_URL != ''
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/command-line-tools
          key: harmony-clt-26.0.0.851-${{ runner.os }}

      - name: Download toolchain
        if: env.CLT_URL != '' && steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL "$CLT_URL" -o "$RUNNER_TEMP/clt.zip"
          if [ -n "$CLT_SHA256" ]; then
            echo "$CLT_SHA256  $RUNNER_TEMP/clt.zip" | sha256sum -c -
          fi
          mkdir -p "$RUNNER_TEMP/clt"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          if [ -d "$RUNNER_TEMP/clt/command-line-tools" ]; then
            mv "$RUNNER_TEMP/clt/command-line-tools" "$RUNNER_TEMP/command-line-tools"
          else
            mv "$RUNNER_TEMP/clt" "$RUNNER_TEMP/command-line-tools"
          fi

      - name: Build
        if: env.CLT_URL != ''
        run: |
          export PATH="$RUNNER_TEMP/command-line-tools/bin:$RUNNER_TEMP/command-line-tools/sdk/default/openharmony/toolchains:$PATH"
          cd apps/harmony
          ohpm install
          hvigorw assembleHap --no-daemon

      - name: Upload HAP
        if: env.CLT_URL != ''
        uses: actions/upload-artifact@v7
        with:
          name: hopa-hap
          path: apps/harmony/phone/build/default/outputs/default/*.hap
          if-no-files-found: error

  brain:
    name: brain (JDK 17 + Kotlin 2.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Kotlin compiler
        uses: actions/cache@v4
        with:
          path: .tools/kotlinc
          key: kotlin-2.1.0-linux
      - name: Install contract-test dependencies
        run: python -m pip install jsonschema
      - name: Compile and test
        run: bash tools/scripts/brain.sh
      - name: Cross-language contract
        run: python tools/scripts/brain-contract.py

  security:
    name: secret and license scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --verbose --redact
      - name: License check
        run: python tools/scripts/license-check.py

  core-tests:
    name: core unit tests (macOS, Local Test)
    # hvigorw Local Test is unsupported on Linux; run it on macOS.
    # Off by default: without the macOS CLT secret the job would only skip, but
    # it still queues a macOS runner and makes the whole run look stuck.
    # Enable with the repository variable ENABLE_ARKTS_TESTS=true.
    if: vars.ENABLE_ARKTS_TESTS == 'true'
    runs-on: macos-latest
    env:
      CLT_URL: ${{ secrets.HARMONY_CLI_TOOLS_URL_MACOS }}
      CLT_SHA256: ${{ secrets.HARMONY_CLI_TOOLS_SHA256_MACOS }}
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain availability
        run: |
          if [ -z "$CLT_URL" ]; then
            echo "::warning title=HarmonyOS macOS toolchain not configured::Set HARMONY_CLI_TOOLS_URL_MACOS (and HARMONY_CLI_TOOLS_SHA256_MACOS) to a mirrored commandline-tools-mac-*-26.0.0.851.zip. Skipping core Local Tests."
          fi

      - name: Restore toolchain cache
        if: env.CLT_URL != ''
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/command-line-tools
          key: harmony-clt-macos-26.0.0.851

      - name: Download toolchain
        if: env.CLT_URL != '' && steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL "$CLT_URL" -o "$RUNNER_TEMP/clt.zip"
          if [ -n "$CLT_SHA256" ]; then
            echo "$CLT_SHA256  $RUNNER_TEMP/clt.zip" | shasum -a 256 -c -
          fi
          mkdir -p "$RUNNER_TEMP/clt"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          if [ -d "$RUNNER_TEMP/clt/command-line-tools" ]; then
            mv "$RUNNER_TEMP/clt/command-line-tools" "$RUNNER_TEMP/command-line-tools"
          else
            mv "$RUNNER_TEMP/clt" "$RUNNER_TEMP/command-line-tools"
          fi

      - name: Run core Local Tests
        if: env.CLT_URL != ''
        run: |
          export PATH="$RUNNER_TEMP/command-line-tools/bin:$RUNNER_TEMP/command-line-tools/sdk/default/openharmony/toolchains:$PATH"
          cd apps/harmony
          ohpm install
          # Do not set DEVECO_SDK_HOME here: a mismatch makes the CLI SDK unavailable.
          hvigorw test -p module=core@default --no-daemon -p coverage=false

  android:
    name: Android (JDK 17)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7
      # Seconds, not minutes: a structure mistake must fail before the SDK and
      # the Gradle build pay for it.
      - name: Android structure
        run: python3 tools/checks/check-android-structure.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure Android SDK 37.1
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37.1" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"
          fi
      - name: Core checks and debug APK
        working-directory: apps/android
        run: ./gradlew ktlintCheck :contracts:check :contracts:test :catalog:check :catalog:test :observation:check :observation:ktlintCheck :observation:test :runlog:check :runlog:ktlintCheck :runlog:test :runtime:check :runtime:ktlintCheck :runtime:test :inference:check :inference:ktlintCheck :inference:test :bridge:check :bridge:ktlintCheck :bridge:test :backend:check :backend:ktlintCheck :backend:test :agent:check :agent:ktlintCheck :agent:test :decision:test :capabilities:testDebugUnitTest :stores:test :feature:launchpad:test :feature:conversations:test :feature:settings:test :feature:execution:test :platform:approval:test :data:testDebugUnitTest :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :capabilities:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon
      - name: Screenshot tests
        working-directory: apps/android
        run: ./gradlew :screenshots:verifyRoborazziDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hopa-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  backend:
    name: Backend (JDK 17)
    runs-on: ubuntu-latest
    env:
      HOPA_ISOLATION_ATTEMPTS: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Backend tests
        working-directory: apps/android
        run: ./gradlew -p ../../services/backend :test --no-daemon

  windows:
    name: Windows client (dotnet)
    runs-on: windows-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.windows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: gradle/actions/setup-gradle@v6
      - name: Sidecar tests
        working-directory: apps/android
        run: .\gradlew.bat -p ../windows/sidecar test --no-daemon
      - name: Headless turn and task protocol (P1/P4 gates)
        working-directory: apps/android
        shell: pwsh
        run: |
          .\gradlew.bat -p ../windows/sidecar installDist --no-daemon
          $cp = "..\windows\sidecar\build\install\hopa-windows-sidecar\lib\*"
          $dir = Join-Path $env:RUNNER_TEMP "hopa-p1"
          $hello = & java -cp $cp com.hopa.sidecar.MainKt --turn "say hello" --data-dir $dir
          if ($hello -notmatch '"records":0') { throw "a plain turn wrote a record: $hello" }
          $pay = & java -cp $cp com.hopa.sidecar.MainKt --turn "pay 100 for the order" --data-dir $dir
          if ($pay -notmatch '"denied":1') { throw "the payment gate did not deny: $pay" }
          if ($pay -notmatch '"executed":0') { throw "a denied payment executed: $pay" }
          $tasks = @('{"type":"task.list","id":"ci-1"}') | & java -cp $cp com.hopa.sidecar.MainKt --data-dir $dir
          if (($tasks -join "`n") -notmatch '"type":"task.list".*"ok":true') { throw "task.list was not answered: $tasks" }
          $missing = @('{"type":"task.get","id":"ci-2","task":"missing"}') | & java -cp $cp com.hopa.sidecar.MainKt --data-dir $dir
          if (($missing -join "`n") -notmatch '"code":"E_SCHEMA"') { throw "an unknown task was not refused: $missing" }
      - name: Build the client
        working-directory: apps/windows/Hopa.Windows
        run: dotnet build -c Debug
      - name: Build the developer tools
        run: dotnet build apps/windows/Hopa.Windows.DevTools -c Debug
      - name: Client tests (observation rules)
        run: dotnet test apps/windows/Hopa.Windows.Tests -c Debug
      - name: Integration tests (engine process, local WebSocket)
        run: dotnet test apps/windows/Hopa.Windows.IntegrationTests -c Debug
      - name: Package (zip)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/scripts/windows-package.ps1 -SkipMsi
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: hopa-windows-package
          path: out/windows/hopa-windows-0.1.0.zip
          if-no-files-found: error
